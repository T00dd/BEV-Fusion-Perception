DATASET: 'ConeDataset'

DATA_PATH: '/workspace/BEV-fusion-sw/carla_dataset_three_classses'

POINT_CLOUD_RANGE: [0, -25, -3, 50, 25, 1]

DATA_SPLIT:
  train: train
  test: val

INFO_PATH:
  train: [cone_infos_train.pkl]
  test: [cone_infos_val.pkl]

# ---------------------------------------------------------------------------
# CLASS-AGNOSTIC + GT SAMPLING (esperimento)
# Prerequisito: gt_database ricompattato a classe 'cone' con
#   python repack_dbinfos_single_class.py --in cone_dbinfos_train.pkl \
#          --out cone_dbinfos_train_cone.pkl
# ---------------------------------------------------------------------------
MERGE_CLASSES_TO: 'cone'

MAP_CLASS_TO_KITTI: {
  'cone': 'Pedestrian'
}

GET_ITEM_LIST: [
  "points"
]
FOV_POINTS_ONLY: False

MIN_POINTS_FOR_GT: 2

POINT_FEATURE_ENCODING: {
  encoding_type: absolute_coordinates_encoding,
  used_feature_list: ['x', 'y', 'z', 'intensity'],
  src_feature_list: ['x', 'y', 'z', 'intensity'],
}

DATA_PROCESSOR:
  - NAME: mask_points_and_boxes_outside_range
    REMOVE_OUTSIDE_BOXES: True

  - NAME: shuffle_points
    SHUFFLE_ENABLED: {
      'train': True,
      'test': False
    }

  - NAME: transform_points_to_voxels
    VOXEL_SIZE: [0.05, 0.05, 0.1]
    MAX_POINTS_PER_VOXEL: 10
    MAX_NUMBER_OF_VOXELS: {
      'train': 30000,
      'test': 45000,
    }

DATA_AUGMENTOR:
  DISABLE_AUG_LIST: ['placeholder']
  AUG_CONFIG_LIST:
    - NAME: gt_sampling
      # senza road-plane i coni incollati stanno alla loro z originale: ok SOLO se la
      # ground CARLA e' piatta. Se hai un piano, metti True e fornisci ROAD_PLANE.
      USE_ROAD_PLANE: False
      DB_INFO_PATH:
        - cone_dbinfos_train_sparse.pkl      # <-- db di soli coni RADI (2-6 punti)
      PREPARE: {
        filter_by_min_points: ['cone:2'],
      }
      # LIMIT_WHOLE_SCENE: False -> aggiunge DAVVERO N coni per scena (con True sarebbe
      # ~no-op in scene gia' dense). Tieni N moderato per non stravolgere la distribuzione.
      SAMPLE_GROUPS: ['cone:6']
      NUM_POINT_FEATURES: 4
      DATABASE_WITH_FAKELIDAR: False
      REMOVE_EXTRA_WIDTH: [0.0, 0.0, 0.0]
      LIMIT_WHOLE_SCENE: False

    - NAME: random_world_flip
      ALONG_AXIS_LIST: ['x']

    - NAME: random_world_rotation
      WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]

    - NAME: random_world_scaling
      WORLD_SCALE_RANGE: [0.95, 1.05]